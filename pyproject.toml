[project]
name = "mpi"
version = "0.1.0"
description = "Personalização Inteligente de Materiais Didáticos com LLMs e o Modelo Felder-Silverman — API, Worker e Pipeline (PIBIC/UFMA)."
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    # exigido pelo EmailStr do Pydantic para validar e-mail nos schemas de entrada.
    "email-validator>=2.2",
    # cliente HTTP usado pelo adaptador de Object Storage (Supabase Storage).
    "httpx>=0.27",
    # exigido pelo FastAPI para interpretar multipart/form-data (upload de Material).
    "python-multipart>=0.0.12",
    # SDK oficial do Gemini; >=2.3.0 é o mínimo com suporte à Interactions API.
    "google-genai>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

# Ruff cobre lint + format num único binário, evitando empilhar flake8/isort/black.
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "migrations"]
# legado fora do padrão de lint novo até ser substituído (Documento 5, Seção 15)
extend-exclude = ["modulos", "main.py", "limpar_latex.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["core", "domain", "application", "infrastructure", "presentation", "shared"]

# Depends(...)/Query(...)/File(...)/Form(...) como valor default são o padrão de DI
# do próprio FastAPI — sem isso o B008 trata cada um como uma chamada mutável comum.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.Form",
]

# mypy: mais maduro que as alternativas para SQLAlchemy 2.0 (Mapped[]) e Pydantic v2.
# plugin oficial do pydantic: sem ele, mypy trata BaseSettings como uma classe comum e
# exige todos os campos sem default como argumento posicional de Settings() — mesmo
# sabendo que em runtime eles vêm do .env/variáveis de ambiente, não do construtor.
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
exclude = ["^modulos/", "^main\\.py$", "^limpar_latex\\.py$"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# pythonpath em src/ permite `from core import ...` sem instalar o projeto como pacote.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# get_engine() é @lru_cache (Fase 2) e mantém um pool de conexões vivo entre
# testes; com loop por função (padrão do pytest-asyncio), o segundo teste que
# reusa o engine recebe conexões presas ao event loop já fechado do teste
# anterior. Loop único por sessão mantém o pool consistente com o engine cacheado.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# aplicação, não biblioteca — uv só gerencia dependências, sem etapa de build/publish
[tool.uv]
package = false
