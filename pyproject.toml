[project]
name = "mpi"
version = "0.1.0"
description = "Personalização Inteligente de Materiais Didáticos com LLMs e o Modelo Felder-Silverman — API, Worker e Pipeline (PIBIC/UFMA)."
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    # exigido pelo EmailStr do Pydantic para validar e-mail nos schemas de entrada.
    "email-validator>=2.2",
    # cliente HTTP usado pelo adaptador de Object Storage (Supabase Storage).
    "httpx>=0.27",
    # exigido pelo FastAPI para interpretar multipart/form-data (upload de Material).
    "python-multipart>=0.0.12",
    # SDK oficial do Gemini; >=2.3.0 é o mínimo com suporte à Interactions API.
    "google-genai>=2.3.0",
    # Pipeline de personalização: extração do Material (PDF) para Markdown.
    "pymupdf4llm>=0.0.17",
    # Pipeline de personalização: conversão do conteúdo adaptado para HTML.
    "markdown>=3.7",
    # Pipeline de personalização: renderização do HTML em PDF. Exige
    # bibliotecas nativas (Pango/Cairo) na imagem de execução.
    "weasyprint>=62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # stubs de tipo para markdown, usado pelo Pipeline de personalização.
    "types-Markdown>=3.7",
    # Teste de carga/concorrência. Usado só por loadtest/, nunca por src/ ou pytest.
    "locust>=2.31",
]

# Ruff cobre lint + format num único binário, evitando empilhar flake8/isort/black.
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "migrations", "loadtest"]
# legado fora do padrão de lint novo até ser substituído
extend-exclude = ["modulos", "main.py", "limpar_latex.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "domain",
    "application",
    "infrastructure",
    "presentation",
    "shared",
    "loadtest",
    "tests",
]

# Depends(...)/Query(...)/File(...)/Form(...) como valor default são o padrão de DI
# do próprio FastAPI; sem isso o B008 trata cada um como uma chamada mutável comum.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.Form",
]

# Plugin oficial do pydantic: sem ele, mypy trata BaseSettings como classe comum
# e exige todos os campos sem default como argumento posicional de Settings().
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
exclude = ["^modulos/", "^main\\.py$", "^limpar_latex\\.py$"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# pymupdf4llm e weasyprint não publicam stubs nem py.typed.
[[tool.mypy.overrides]]
module = ["pymupdf4llm", "weasyprint"]
ignore_missing_imports = true

# pythonpath em src/ permite `from core import ...` sem instalar o projeto como pacote.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# get_engine() é @lru_cache e mantém o pool vivo entre testes; loop por função
# faria o segundo teste reusar conexões presas a um event loop já fechado.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# aplicação, não biblioteca: uv só gerencia dependências, sem etapa de build/publish
[tool.uv]
package = false
